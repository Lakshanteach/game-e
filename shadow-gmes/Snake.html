<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:12px}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.title{font-weight:700;font-size:17px}
.chips{display:flex;gap:6px}
.chip{background:#1a2342;border-radius:12px;padding:5px 12px;font-size:11px;text-align:center;min-width:64px;letter-spacing:1px;opacity:.95}
.chip b{display:block;font-size:18px;letter-spacing:0}
.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;flex-direction:column}
canvas{border-radius:16px;display:block}
.hint{margin-top:8px;font-size:13px;opacity:.65;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px;margin-top:10px}
.pad button{background:#1a2342;color:#fff;border:0;border-radius:12px;font-size:22px}.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
</style></head><body>
<div id="app">
<div class="top"><div class="title">🐍 Snake</div><div class="chips"><div class="chip">SCORE<b id="sc">0</b></div><div class="chip">BEST<b id="bs">0</b></div></div></div>
<div class="stage"><canvas id="cv" width="320" height="320"></canvas></div>
<div class="pad"><button class="u" data-d="u">▲</button><button class="l" data-d="l">◀</button><button class="d" data-d="d">▼</button><button class="r" data-d="r">▶</button></div>
<div class="hint">Swipe / arrow keys / buttons</div>
</div>
<script>
var KEY="shadow-game-snake";
function $(s){return document.querySelector(s)}
var Best={get:function(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}},set:function(v){try{localStorage.setItem(KEY,v)}catch(e){}}};
var best=Best.get();$("#bs").textContent=best||0;
function setScore(v){$("#sc").textContent=v}
function submit(v){if(v>best){best=v;Best.set(v);$("#bs").textContent=v}}
function fit(cv){var s=document.querySelector(".stage");function f(){var k=Math.min(s.clientWidth/cv.width,s.clientHeight/cv.height);cv.style.width=Math.floor(cv.width*k)+"px";cv.style.height=Math.floor(cv.height*k)+"px"}f();addEventListener("resize",f)}
function onSwipe(cb,tap){var sx=0,sy=0;addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY});addEventListener("pointerup",function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24){if(tap)tap(e);return}if(Math.abs(dx)>Math.abs(dy))cb(dx>0?"r":"l");else cb(dy>0?"d":"u")})}
var cv=$("#cv"),ctx=cv.getContext("2d"),N=16,C=20;fit(cv);
var snake,dir,queue,food,score,alive,timer,speed,started;
function placeFood(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(function(s){return s.x===food.x&&s.y===food.y}))}
function reset(){snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};queue=[];score=0;setScore(0);speed=140;alive=true;started=false;clearTimeout(timer);placeFood();draw()}
var V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function turn(k){
  var v=V[k],last=queue.length?queue[queue.length-1]:dir;
  if(!alive)return;
  if((last.x===-v[0]&&last.y===-v[1])||(last.x===v[0]&&last.y===v[1])){if(!started){started=true;schedule()}return}
  if(queue.length<3)queue.push({x:v[0],y:v[1]});
  if(!started){started=true;schedule()}
}
function schedule(){clearTimeout(timer);timer=setTimeout(tick,speed)}
function tick(){
  if(queue.length)dir=queue.shift();
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(function(s){return s.x===h.x&&s.y===h.y})){alive=false;submit(score);draw();return}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;setScore(score);speed=Math.max(60,speed-3);placeFood()}else snake.pop();
  draw();schedule();
}
function msg(t,y){ctx.font="bold 20px sans-serif";ctx.textAlign="center";ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,y-26,320,40);ctx.fillStyle="#fff";ctx.fillText(t,160,y)}
function draw(){
  ctx.fillStyle="#10182f";ctx.fillRect(0,0,320,320);
  ctx.fillStyle="#162040";for(var x=0;x<N;x++)for(var y=0;y<N;y++)if((x+y)%2===0)ctx.fillRect(x*C,y*C,C,C);
  ctx.fillStyle="#ff4d5e";ctx.beginPath();ctx.arc(food.x*C+10,food.y*C+10,7,0,7);ctx.fill();
  snake.forEach(function(s,i){ctx.fillStyle=i===0?"#8dff7a":"#3ecf5c";ctx.beginPath();ctx.roundRect?ctx.roundRect(s.x*C+1,s.y*C+1,C-2,C-2,6):ctx.rect(s.x*C+1,s.y*C+1,C-2,C-2);ctx.fill()});
  if(!started&&alive)msg("Swipe to start",160);
  if(!alive)msg("Game over - tap to retry",160);
}
addEventListener("keydown",function(e){var m={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",w:"u",s:"d",a:"l",d:"r"}[e.key];if(m){e.preventDefault();turn(m)}});
onSwipe(turn,function(){if(!alive)reset()});
document.querySelectorAll(".pad button").forEach(function(b){b.addEventListener("pointerdown",function(e){e.stopPropagation();if(!alive){reset();return}turn(b.dataset.d)})});
reset();
</script></body></html>
