<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Bird</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:12px}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.title{font-weight:700;font-size:17px}
.chips{display:flex;gap:6px}
.chip{background:#1a2342;border-radius:12px;padding:5px 12px;font-size:11px;text-align:center;min-width:64px;letter-spacing:1px;opacity:.95}
.chip b{display:block;font-size:18px;letter-spacing:0}
.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;flex-direction:column}
canvas{border-radius:16px;display:block}
.hint{margin-top:8px;font-size:13px;opacity:.65;text-align:center}
</style></head><body>
<div id="app">
<div class="top"><div class="title">🐤 Flappy Bird</div><div class="chips"><div class="chip">PIPES<b id="sc">0</b></div><div class="chip">BEST<b id="bs">0</b></div></div></div>
<div class="stage"><canvas id="cv" width="320" height="480"></canvas></div>
<div class="hint">Tap the screen (or Space) to flap</div>
</div>
<script>
var KEY="shadow-game-flappy";
function $(s){return document.querySelector(s)}
var Best={get:function(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}},set:function(v){try{localStorage.setItem(KEY,v)}catch(e){}}};
var best=Best.get();$("#bs").textContent=best||0;
function setScore(v){$("#sc").textContent=v}
function submit(v){if(v>best){best=v;Best.set(v);$("#bs").textContent=v}}
function fit(cv){var s=document.querySelector(".stage");function f(){var k=Math.min(s.clientWidth/cv.width,s.clientHeight/cv.height);cv.style.width=Math.floor(cv.width*k)+"px";cv.style.height=Math.floor(cv.height*k)+"px"}f();addEventListener("resize",f)}
var cv=$("#cv"),ctx=cv.getContext("2d"),W=320,H=480,GROUND=420,GAP=135,PW=52;fit(cv);
var st="ready",bird,pipes,score,frame,acc=0,last=0,overAt=0;
function reset2(){bird={x:80,y:H/2,vy:0,r:12};pipes=[];score=0;frame=0;setScore(0)}
reset2();
function flap(){
  if(st==="over"){if(Date.now()-overAt<400)return;reset2();st="ready";return}
  if(st==="ready")st="play";
  bird.vy=-7.2;
}
addEventListener("pointerdown",function(e){e.preventDefault();flap()});
addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();flap()}});
function die(){st="over";overAt=Date.now();submit(score)}
function step(){
  if(st==="ready"){bird.y=H/2+Math.sin(Date.now()/200)*6;return}
  if(st!=="play")return;
  bird.vy+=0.42;bird.y+=bird.vy;frame++;
  if(frame%85===1)pipes.push({x:W,top:50+Math.random()*185,passed:false});
  for(var i=0;i<pipes.length;i++){
    var p=pipes[i];p.x-=2.4;
    if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++;setScore(score)}
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PW&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+GAP))die();
  }
  pipes=pipes.filter(function(p){return p.x>-70});
  if(bird.y+bird.r>GROUND||bird.y-bird.r<0)die();
}
function cloud(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+r*.9,y+4,r*.8,0,7);ctx.fill()}
function txt(t,y,size){ctx.font="bold "+size+"px sans-serif";ctx.textAlign="center";ctx.lineWidth=5;ctx.strokeStyle="#0b3550";ctx.strokeText(t,W/2,y);ctx.fillStyle="#fff";ctx.fillText(t,W/2,y)}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#4ec0ff");g.addColorStop(1,"#c8ecff");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.85)";cloud(60,90,26);cloud(230,150,22);cloud(130,240,18);
  pipes.forEach(function(p){
    ctx.fillStyle="#3fbf4f";ctx.fillRect(p.x,0,PW,p.top);ctx.fillRect(p.x,p.top+GAP,PW,GROUND-p.top-GAP);
    ctx.fillStyle="#2f9a3c";ctx.fillRect(p.x-3,p.top-22,PW+6,22);ctx.fillRect(p.x-3,p.top+GAP,PW+6,22);
  });
  ctx.fillStyle="#ded895";ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle="#5cc043";ctx.fillRect(0,GROUND,W,10);
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-0.5,Math.min(1.2,bird.vy/10)));
  ctx.fillStyle="#ffd93b";ctx.beginPath();ctx.arc(0,0,bird.r,0,7);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(5,-4,4.5,0,7);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(6.5,-4,2,0,7);ctx.fill();
  ctx.fillStyle="#ff8a1f";ctx.beginPath();ctx.moveTo(9,1);ctx.lineTo(19,4);ctx.lineTo(9,8);ctx.fill();ctx.restore();
  if(st!=="ready")txt(String(score),70,42);
  if(st==="ready")txt("Tap to start",170,26);
  if(st==="over"){txt("Game over",190,32);txt("Tap to retry",225,20)}
}
function loop(t){if(!last)last=t;acc+=t-last;last=t;if(acc>100)acc=100;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
