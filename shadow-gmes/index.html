<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0b1020, #1a1a3e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { opacity: 0.6; margin-bottom: 32px; font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }
    a {
      background: #1a2342;
      border-radius: 16px;
      padding: 22px 12px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      transition: transform 0.15s, background 0.15s;
    }
    a:hover { background: #243056; transform: translateY(-3px); }
    a span { display: block; font-size: 32px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>🎮 Shadow Games</h1>
  <p>Tap a game to play</p>
  <div class="grid">
    <a href="Flappy-Bird.html"><span>🐤</span>Flappy Bird</a>
    <a href="Snake.html"><span>🐍</span>Snake</a>
    <a href="Memory-Match.html"><span>🧠</span>Memory</a>
    <a href="Tic-Tac-Toe.html"><span>❌</span>Tic-Tac-Toe</a>
    <a href="2048.html"><span>🔢</span>2048</a>
  </div>
</body>
</html>
